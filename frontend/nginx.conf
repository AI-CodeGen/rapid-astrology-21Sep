# Custom Nginx config to serve static files and proxy /api to backend
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  # gzip can be enabled if desired
  # gzip on;

  upstream backend_api {
    server backend:4000;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API
    location /api/ {
      # Preserve /api prefix (Express mounts routes under /api)
      # Using trailing slash in location and no slash in proxy_pass keeps full path.
      proxy_pass http://backend_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
      try_files $uri /index.html;
    }
  }
}
